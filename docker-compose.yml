name: regintel-dev

# ── Default DB credentials ─────────────────────────────────────────────────
# Override by creating a .env file with REGINTEL_DB_PASS=yourpassword
# The same credentials must be in .env as DATABASE_URL / DATABASE_URL_SYNC.

services:
  db:
    image: pgvector/pgvector:pg16
    container_name: regintel-db
    environment:
      POSTGRES_USER: ${REGINTEL_DB_USER:-regintel}
      POSTGRES_PASSWORD: ${REGINTEL_DB_PASS:-regintel_dev_pass}
      POSTGRES_DB: ${REGINTEL_DB_NAME:-regintel}
    ports:
      - "5432:5432"
    networks:
      - regintel_net
    volumes:
      - ./pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${REGINTEL_DB_USER:-regintel} -d ${REGINTEL_DB_NAME:-regintel}"]
      interval: 5s
      timeout: 5s
      retries: 10
      start_period: 10s

  backend:
    build:
      context: .
      dockerfile: Dockerfile
      # Local dev keeps the full ML stack (BGE embeddings). Small hosts
      # (e.g. Render free tier) build the same Dockerfile WITHOUT this arg
      # and get the slim TF-IDF fallback image instead.
      args:
        INSTALL_ML_STACK: "1"
    image: regintel/backend:dev
    container_name: regintel-backend
    depends_on:
      db:
        condition: service_healthy
    env_file:
      - .env
    environment:
      # Override DATABASE_URL to point at the docker-compose db service.
      # These match the db service credentials above.
      DATABASE_URL: postgresql+asyncpg://${REGINTEL_DB_USER:-regintel}:${REGINTEL_DB_PASS:-regintel_dev_pass}@db:5432/${REGINTEL_DB_NAME:-regintel}
      DATABASE_URL_SYNC: postgresql+psycopg2://${REGINTEL_DB_USER:-regintel}:${REGINTEL_DB_PASS:-regintel_dev_pass}@db:5432/${REGINTEL_DB_NAME:-regintel}
      # pgvector extension is available in the pgvector/pgvector image
      USE_PGVECTOR_FALLBACK: "false"
      LOG_LEVEL: info
    ports:
      - "8000:8000"
    volumes:
      - ./storage:/app/storage
    healthcheck:
      test: ["CMD", "curl", "-fsS", "http://127.0.0.1:8000/health/ready"]
      interval: 30s
      timeout: 10s
      retries: 5
      start_period: 120s
    networks:
      - regintel_net
    deploy:
      resources:
        limits:
          cpus: "4.0"
          memory: 4G
        reservations:
          cpus: "1.0"
          memory: 2G

  frontend:
    image: nginx:1.27-alpine
    container_name: regintel-frontend
    depends_on:
      backend:
        condition: service_healthy
    ports:
      - "80:80"
    volumes:
      - ./frontend/dist:/usr/share/nginx/html:ro
      - ./landing:/usr/share/nginx/landing:ro
      - ./nginx.conf:/etc/nginx/nginx.conf:ro
    networks:
      - regintel_net
    deploy:
      resources:
        limits:
          cpus: "0.5"
          memory: 128M

networks:
  regintel_net:
    driver: bridge
    name: regintel_net
