# RegIntel AI — Render Blueprint (Infrastructure as Code)
# Docs: https://render.com/docs/blueprint-spec
#
# PRIMARY PRODUCTION PATH: a SINGLE Docker web service serving ONE origin:
#   https://<service>.onrender.com/          → public landing page
#   https://<service>.onrender.com/app/      → React application (SPA)
#   https://<service>.onrender.com/api/v1/*  → FastAPI API
#   https://<service>.onrender.com/health/*  → health probes
#   https://<service>.onrender.com/docs      → OpenAPI docs (enabled, see below)
#
# The image (root Dockerfile) contains backend + built React SPA + landing
# page. Same origin ⇒ no CORS configuration, no VITE_* wiring, no second
# service. Alternative self-hosted layouts (nginx + compose, static CDN
# frontend) still exist in-repo but are NOT this path.
#
# Cost: $0 — free web service (512 MB). No Render Postgres.
# Database: YOUR free Neon Postgres (neon.tech, 3 GB, pgvector-capable).
#   Paste its DIRECT connection string (port 5432, not pooled 6543) at the
#   DATABASE_URL prompt. Migrations run automatically inside the container.
#
# IMPORTANT free-tier realities baked into this file:
# 1. 512 MB RAM ⇒ the image skips torch/transformers (Dockerfile default).
#    Embeddings use TF-IDF and reranking uses RRF fusion order. This is
#    EXPOSED, not hidden: /health/ready reports embedding_backend +
#    reranker status, and intelligence responses carry rerank_degraded.
#    Full BGE quality needs a paid plan + INSTALL_ML_STACK=1 image.
# 2. No persistent disk ⇒ uploads, SQLite-style state and JSONL stores live
#    under /tmp and reset on redeploy. Postgres holds all metadata.
# 3. Free services sleep on idle (≈50s cold start on first hit).
# 4. Production refuses to boot on LLM_PROVIDER=mock — set a real key.
#    Gemini has a free tier: https://aistudio.google.com/apikey
#
# Deploy:
#   1. Push this repo to GitHub/GitLab/Bitbucket.
#   2. Render Dashboard → New → Blueprint → select your repo → Deploy.
#   3. When prompted, fill DATABASE_URL, LLM_API_KEY, ADMIN_SEED_PASSWORD.
#      Everything else is wired.
#   4. First boot runs Alembic migrations, seeds nothing by default, and
#      bootstraps exactly one admin IFF ADMIN_SEED_* are set (empty storage).

services:
  - type: web
    name: regintel
    runtime: docker
    dockerfilePath: ./Dockerfile
    plan: free # 1 worker / 512 MB verified for the slim image; scale up for ML
    healthCheckPath: /health/live
    numInstances: 1 # KG/BM25 stores are process-local; do not replicate on free
    envVars:
      - key: ENV
        value: production
      - key: PROJECT_NAME
        value: RegIntel AI
      - key: LOG_LEVEL
        value: INFO
      - key: WORKERS
        value: 1
      # ── Database: free Neon Postgres (you supply the URL, nothing hosted) ──
      # DIRECT connection string, e.g.:
      #   postgresql://USER:PASSWORD@HOST:5432/DBNAME?sslmode=require
      # NOT the pooled port-6543 URL. TLS + scheme handling is automatic.
      # (DATABASE_URL_SYNC auto-derives; Alembic runs in the entrypoint.)
      - key: DATABASE_URL
        sync: false # <-- prompted in the Dashboard; nothing secret is committed
      - key: STORAGE_ROOT
        value: /tmp/regintel-storage
      - key: USE_PGVECTOR_FALLBACK
        value: true
      - key: EMBEDDING_DEVICE
        value: cpu
      - key: RERANKER_DEVICE
        value: cpu
      # ── LLM (REQUIRED — production refuses to boot on "mock") ──
      - key: LLM_PROVIDER
        value: gemini # openai | gemini | litellm (gemini has a free tier)
      - key: LLM_MODEL
        value: gemini-2.0-flash
      - key: LLM_API_KEY
        sync: false # <-- prompted in the Dashboard
      # ── Auth / gateway ──
      - key: AUTH_ENABLED
        value: true
      - key: SECURITY_DEV_TOKEN_ENDPOINT
        value: false
      - key: API_KEY_AUTH_ENABLED
        value: false
      - key: RATE_LIMIT_ENABLED
        value: true
      - key: RATE_LIMIT_PER_MINUTE
        value: 300
      - key: REQUEST_TRACING_ENABLED
        value: true
      - key: SECURITY_HEADERS_ENABLED
        value: true
      - key: AUDIT_LOG_ENABLED
        value: true
      - key: AUDIT_LOG_PERSIST
        value: false
      # CORS_ORIGINS intentionally unset: single origin needs no CORS.
      - key: STARTUP_REQUIRED_ENV
        value: DATABASE_URL,STORAGE_ROOT
      - key: STARTUP_RAISE_ON_ERROR
        value: false
      # ── First admin (no default passwords exist in production) ──
      # Created only on empty storage; changing the value later does NOT
      # reset the password. Min 12 chars. Empty = no users seeded.
      - key: ADMIN_SEED_EMAIL
        value: admin@regintel.ai
      - key: ADMIN_SEED_PASSWORD
        sync: false # <-- prompted in the Dashboard
      # ── API docs ON (acceptance + operability over obscurity) ──
      - key: ENABLE_API_DOCS
        value: true
      - key: REGINTEL_JWT_SECRET
        generateValue: true

# NOTE: no `databases:` section on purpose — Render Postgres is paid.
# The service above connects to YOUR free Neon Postgres via DATABASE_URL.
# Nothing else to provision here.
