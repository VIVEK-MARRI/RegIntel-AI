# RegIntel AI — Render Blueprint: $0 portfolio/demo deployment
# Docs: https://render.com/docs/blueprint-spec
#
# ARCHITECTURE (single coherent product, two free services + free DB):
#   browser ──GET / ──▶ regintel-frontend (static site, global CDN)
#     /                  → landing page (index.html + 3D hero)
#     /app/*             → React SPA (/app/index.html fallback)
#   browser ──fetch https://<backend>/api/*──▶ regintel-backend (free web)
#     FastAPI + TF-IDF/BM25 retrieval + fusion-order ranking
#   regintel-backend ──TLS──▶ YOUR free Neon Postgres (pgvector-capable)
#
# COST: $0. No Render Postgres, no disk, no paid plan, no Redis, no extras.
# Prompts at deploy: DATABASE_URL (Neon), LLM_API_KEY (optional*), ADMIN seed.
# *Without an LLM key the backend boots in clearly-labelled demo mode.
#
# HONEST FREE-TIER BOUNDARIES (also surfaced via /health/ready + metadata):
# 1. 512 MB RAM, 0.1 CPU, sleeps on idle (~50s cold start). No torch:
#    embeddings = TF-IDF (384-d, model "tfidf_fallback"), reranking OFF
#    (RRF fusion order used, flagged rerank_degraded). NOT BGE quality.
# 2. Ephemeral filesystem: uploads + JSONL stores reset on redeploy.
#    Postgres holds users/documents/chunks/graph/audit durably.
# 3. Single instance: KG/BM25 state is per-process (consistent: only 1).
# 4. Demo corpus: 6 public-domain excerpts auto-seed once (tagged demo-corpus).
#
# Deploy:
#   1. Push repo to GitHub/GitLab/Bitbucket.
#   2. Create a FREE Neon Postgres (neon.tech); copy the DIRECT URL
#      (port 5432, NOT pooled 6543), e.g.
#      postgresql://USER:PASSWORD@HOST:5432/DBNAME?sslmode=require
#   3. Render Dashboard → New → Blueprint → select repo → Deploy.
#   4. Fill DATABASE_URL (+ optional LLM_API_KEY, ADMIN_SEED_PASSWORD).
#   5. Backend runs Alembic migrations (incl. pgvector + KG tables), seeds
#      the demo corpus once, then frontend builds against the backend URL.
#      If the frontend builds before the backend URL exists, manually
#      redeploy regintel-frontend once.

services:
  # ─── Backend API (FastAPI, native Python, no torch) ────────────────
  - type: web
    name: regintel-backend
    runtime: python
    plan: free
    buildCommand: "pip install --upgrade pip && pip install -r requirements.txt -r requirements-llm.txt"
    # No requirements-ml.txt: torch does not fit 512 MB. TF-IDF fallback
    # is automatic (no code change needed).
    preDeployCommand: "alembic upgrade head"
    startCommand: "uvicorn app.main:app --host 0.0.0.0 --port $PORT --workers 1 --timeout-keep-alive 5 --log-level info"
    # 1 worker: memory-safe on free AND keeps process-local KG/BM25 coherent.
    healthCheckPath: /health/live
    envVars:
      - key: PYTHON_VERSION
        value: 3.11.0
      - key: ENV
        value: production
      - key: PROJECT_NAME
        value: RegIntel AI
      - key: LOG_LEVEL
        value: INFO
      # ── Database: YOUR free Neon Postgres (nothing hosted by Render) ──
      # DIRECT URL, e.g. postgresql://USER:PASSWORD@HOST:5432/DBNAME?sslmode=require
      # TLS + scheme handling automatic; sync URL auto-derives for Alembic.
      - key: DATABASE_URL
        sync: false # <-- prompted in the Dashboard; nothing secret is committed
      - key: STORAGE_ROOT
        value: /tmp/regintel-storage
      - key: USE_PGVECTOR_FALLBACK
        value: true
      - key: EMBEDDING_DEVICE
        value: cpu
      - key: RERANKER_DEVICE
        value: cpu
      # ── Demo corpus: public excerpts, one-shot, tagged demo-corpus ──
      - key: SEED_DEMO_CORPUS
        value: true
      # ── LLM: real provider when keyed, labelled demo mode when not ──
      # No key ⇒ production refuses mock, so demo mode is explicit: set
      # DEMO_MODE=true to allow mock answers (clearly labelled in API).
      # With a key, set LLM_PROVIDER + LLM_API_KEY (gemini free tier works).
      - key: LLM_PROVIDER
        value: gemini # openai | gemini | litellm | mock (mock needs DEMO_MODE)
      - key: LLM_MODEL
        value: gemini-2.0-flash
      - key: LLM_API_KEY
        sync: false # <-- prompted; empty + DEMO_MODE=true ⇒ labelled demo
      - key: DEMO_MODE
        value: true
      # ── Auth / gateway ──
      - key: AUTH_ENABLED
        value: true
      - key: SECURITY_DEV_TOKEN_ENDPOINT
        value: false
      - key: API_KEY_AUTH_ENABLED
        value: false
      - key: RATE_LIMIT_ENABLED
        value: true
      - key: RATE_LIMIT_PER_MINUTE
        value: 300
      - key: REQUEST_TRACING_ENABLED
        value: true
      - key: SECURITY_HEADERS_ENABLED
        value: true
      - key: AUDIT_LOG_ENABLED
        value: true
      - key: AUDIT_LOG_PERSIST
        value: false
      # CORS: exact frontend origin only (never wildcard with credentials).
      # Auto-wired to the static site's public URL below.
      - key: CORS_ORIGINS
        fromService:
          name: regintel-frontend
          type: web
          envVarKey: RENDER_EXTERNAL_URL
      - key: STARTUP_REQUIRED_ENV
        value: DATABASE_URL,STORAGE_ROOT
      - key: STARTUP_RAISE_ON_ERROR
        value: false
      # ── First admin (created only on empty user table) ──
      - key: ADMIN_SEED_EMAIL
        value: admin@regintel.ai
      - key: ADMIN_SEED_PASSWORD
        sync: false # <-- prompted; min 12 chars
      # ── API docs ON for a demo deployment (inspectable + honest) ──
      - key: ENABLE_API_DOCS
        value: true
      - key: REGINTEL_JWT_SECRET
        generateValue: true

  # ─── Frontend (landing + SPA, global CDN) ──────────────────────────
  - type: web
    name: regintel-frontend
    runtime: static
    buildCommand: "cd frontend && npm ci --no-audit --no-fund && npm run build:static"
    staticPublishPath: frontend/dist
    routes:
      # SPA fallback first (more specific), landing fallback second.
      # /api/* is never rewritten: the browser calls the backend origin.
      - type: rewrite
        source: /app/*
        destination: /app/index.html
      - type: rewrite
        source: /*
        destination: /index.html
    headers:
      - path: /*
        name: X-Frame-Options
        value: SAMEORIGIN
      - path: /app/assets/*
        name: Cache-Control
        value: public, max-age=31536000, immutable
    envVars:
      # Baked into the bundle at build time (Vite limitation): backend URL,
      # SPA base path, auth flag, display-only provider flags.
      - key: VITE_API_BASE_URL
        fromService:
          name: regintel-backend
          type: web
          envVarKey: RENDER_EXTERNAL_URL
      - key: VITE_BASENAME
        value: /app
      - key: VITE_AUTH_ENABLED
        value: true
      - key: VITE_LLM_PROVIDER
        value: gemini
      - key: VITE_RERANKER_ENABLED
        value: false

# NOTE: no `databases:` section — Render Postgres is paid and its free tier
# expires. The backend above connects to YOUR free Neon Postgres.
# Nothing else to provision here.
